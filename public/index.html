<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Forma</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-2: #20242d;
    --text: #f3f4f6;
    --muted: #9aa0ab;
    --accent: #4ade80;
    --accent-2: #22c55e;
    --danger: #f87171;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: 76px;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 16px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 0 16px; gap: 10px;
  }
  header.top h1 { font-size: 20px; margin: 0; }
  header.top .sub { color: var(--muted); font-size: 12px; }
  .top-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .lang-switch { display: flex; background: var(--card-2); border-radius: 999px; padding: 2px; }
  .lang-switch button {
    width: auto; padding: 5px 10px; font-size: 11px; border-radius: 999px;
    background: transparent; color: var(--muted);
  }
  .lang-switch button.active { background: var(--accent); color: #06250f; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .card h2 { margin: 0 0 10px; font-size: 16px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea {
    width: 100%;
    background: var(--card-2);
    border: 1px solid #2c313c;
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
  }
  textarea { resize: vertical; min-height: 60px; }
  button {
    border: none; border-radius: 12px; padding: 12px 16px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #06250f; width: 100%; }
  .btn-secondary { background: var(--card-2); color: var(--text); width: 100%; }
  .btn-danger { background: transparent; color: var(--danger); }
  .btn-sm { padding: 8px 12px; font-size: 13px; }
  .muted { color: var(--muted); font-size: 13px; }
  .pill {
    display: inline-block; background: var(--card-2); color: var(--muted);
    border-radius: 999px; padding: 4px 10px; font-size: 11px;
  }
  .screen { display: none; }
  .screen.active { display: block; }
  nav.bottom {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card); border-top: 1px solid #262a33;
    display: flex; justify-content: space-around; padding: 8px 4px;
    max-width: 480px; margin: 0 auto;
  }
  nav.bottom .tab {
    flex: 1; text-align: center; color: var(--muted);
    font-size: 11px; padding: 6px 2px; cursor: pointer; border-radius: 10px;
  }
  nav.bottom .tab.active { color: var(--accent); background: rgba(74,222,128,0.08); }
  nav.bottom .tab .ic { font-size: 18px; display: block; }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .overlay.hidden { display: none; }
  .sheet {
    background: var(--bg); width: 100%; max-width: 480px;
    border-radius: 20px 20px 0 0; padding: 20px 16px 24px; max-height: 88vh; overflow-y: auto;
  }
  .step-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; }
  .step-dots span { width: 7px; height: 7px; border-radius: 50%; background: #2c313c; }
  .step-dots span.on { background: var(--accent); }
  .chat-log { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; max-height: 50vh; overflow-y: auto; }
  .msg { padding: 10px 12px; border-radius: 14px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; max-width: 85%; }
  .msg.user { background: var(--accent); color: #06250f; align-self: flex-end; }
  .msg.assistant { background: var(--card-2); align-self: flex-start; }
  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row input { flex: 1; }
  .chat-input-row button { width: auto; padding: 10px 14px; }
  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #262a33; font-size: 13px; }
  .list-item:last-child { border-bottom: none; }
  .empty { text-align: center; color: var(--muted); padding: 20px 0; font-size: 13px; }

  .md-content h1, .md-content h2 { color: var(--accent); font-size: 16px; margin: 14px 0 8px; }
  .md-content h1:first-child, .md-content h2:first-child { margin-top: 0; }
  .md-content h3 { color: var(--accent); font-size: 15px; margin: 14px 0 8px; }
  .md-content h3:first-child { margin-top: 0; }
  .md-content h4 {
    color: var(--text); font-size: 14px; margin: 16px 0 8px; padding-top: 12px;
    border-top: 1px solid #262a33;
  }
  .md-content h4:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  .md-content h5, .md-content h6 { color: var(--muted); font-size: 12px; margin: 10px 0 4px; }
  .md-content ul { margin: 4px 0 10px; padding-left: 18px; }
  .md-content li { margin-bottom: 4px; font-size: 13px; line-height: 1.5; }
  .md-content p { margin: 6px 0; font-size: 13px; line-height: 1.5; }
  .md-content hr { border: none; border-top: 1px solid #262a33; margin: 12px 0; }
  .md-content strong { color: var(--accent); font-weight: 600; }
  .exercise-links { display: flex; gap: 8px; margin: 2px 0 8px; flex-wrap: wrap; }
  .exercise-links a {
    font-size: 11px; color: var(--accent); background: rgba(74,222,128,0.1);
    padding: 4px 9px; border-radius: 999px; text-decoration: none;
  }
  .msg.assistant .md-content h3, .msg.assistant .md-content h4 { margin-top: 10px; }

  .exercise-card {
    background: var(--card-2);
    border: 1px solid #2c313c;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .exercise-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .exercise-num {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--accent); color: #06250f;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
  }
  .exercise-name { font-size: 14px; font-weight: 600; }
  .exercise-rows { margin-top: 8px; }
  .exercise-row {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 7px 0; border-bottom: 1px solid #262a33; font-size: 13px;
  }
  .exercise-row:last-child { border-bottom: none; }
  .exercise-row-label { color: var(--muted); flex-shrink: 0; }
  .exercise-row-value { text-align: right; }
  .exercise-row-note { font-size: 13px; color: var(--muted); padding: 4px 0; line-height: 1.5; }
  .plan-intro { font-size: 13px; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }

  .nutri-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .nutri-item {
    background: var(--card-2); border-radius: 12px; padding: 10px 12px;
  }
  .nutri-item .val { font-size: 18px; font-weight: 700; color: var(--accent); }
  .nutri-item .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .nutri-toggle {
    text-align: center; color: var(--muted); font-size: 12px;
    margin-top: 12px; cursor: pointer;
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <h1>💪 Forma</h1>
      <div class="sub" data-i18n="tagline"></div>
    </div>
    <div class="top-right">
      <div class="lang-switch">
        <button type="button" id="langUz">UZ</button>
        <button type="button" id="langRu">RU</button>
      </div>
      <div class="pill" id="modeBadge">—</div>
    </div>
  </header>

  <!-- BUGUN -->
  <section class="screen active" id="screen-today">
    <div class="card" id="briefCard">
      <h2 data-i18n="briefTitle"></h2>
      <p class="muted" data-i18n="briefIntro"></p>

      <label data-i18n="labelGoal"></label>
      <select id="briefGoal">
        <option value="muscle" data-i18n="goalMuscle"></option>
        <option value="strength" data-i18n="goalStrength"></option>
        <option value="fatloss" data-i18n="goalFatloss"></option>
        <option value="recomp" data-i18n="goalRecomp"></option>
        <option value="mixed" data-i18n="goalMixed"></option>
      </select>

      <label data-i18n="labelMuscleGroup"></label>
      <input id="briefMuscle" data-i18n-ph="placeholderMuscleGroup" />

      <label><span data-i18n="labelEnergy"></span>: <span id="energyVal">7</span>/10</label>
      <input id="briefEnergy" type="range" min="1" max="10" value="7" />

      <label data-i18n="labelSleep"></label>
      <input id="briefSleep" type="number" min="0" max="14" value="7" />

      <label data-i18n="labelLastWorkout"></label>
      <input id="briefLast" data-i18n-ph="placeholderLastWorkout" />

      <label data-i18n="labelTime"></label>
      <select id="briefTime">
        <option value="45" data-i18n="time45"></option>
        <option value="60" selected data-i18n="time60"></option>
        <option value="90" data-i18n="time90"></option>
        <option value="120" data-i18n="time120"></option>
      </select>

      <label data-i18n="labelPain"></label>
      <input id="briefPain" data-i18n-ph="placeholderPain" />

      <button class="btn-primary" style="margin-top:14px" id="getWorkoutBtn" data-i18n="btnGetWorkout"></button>
    </div>

    <div class="card" id="planCard" style="display:none">
      <h2 data-i18n="planTitle"></h2>
      <div id="planText" class="md-content"></div>
      <button class="btn-secondary" style="margin-top:12px" id="newBriefBtn" data-i18n="btnNewBrief"></button>
    </div>

    <div class="card">
      <h2 data-i18n="logTitle"></h2>
      <div class="row">
        <input id="logExercise" data-i18n-ph="placeholderExercise" />
      </div>
      <div class="row" style="margin-top:8px">
        <input id="logSets" type="number" data-i18n-ph="placeholderSets" min="1" />
        <input id="logReps" type="number" data-i18n-ph="placeholderReps" min="1" />
        <input id="logWeight" type="number" data-i18n-ph="placeholderWeight" min="0" />
      </div>
      <button class="btn-secondary" style="margin-top:10px" id="addLogBtn" data-i18n="btnAdd"></button>
      <div id="logList" style="margin-top:10px"></div>
    </div>
  </section>

  <!-- MURABBIY -->
  <section class="screen" id="screen-coach">
    <div class="card">
      <h2>🧑‍🏫 <span data-i18n="coachTitle"></span></h2>
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-input-row">
        <input id="chatInput" data-i18n-ph="placeholderChat" />
        <button class="btn-primary" id="chatSendBtn" data-i18n="btnSend"></button>
      </div>
    </div>
  </section>

  <!-- NATIJA -->
  <section class="screen" id="screen-progress">
    <div class="card">
      <h2>📈 <span data-i18n="progressTitle"></span></h2>
      <div class="row">
        <input id="progWeight" type="number" step="0.1" data-i18n-ph="placeholderWeightKg" />
        <input id="progWaist" type="number" step="0.1" data-i18n-ph="placeholderWaist" />
      </div>
      <button class="btn-secondary" style="margin-top:10px" id="addProgressBtn" data-i18n="btnSave"></button>
    </div>
    <div class="card">
      <h2 data-i18n="historyTitle"></h2>
      <div id="progressList"></div>
    </div>
  </section>

  <!-- PROFIL -->
  <section class="screen" id="screen-profile">
    <div class="card">
      <h2>👤 <span data-i18n="profileTitle"></span></h2>
      <label data-i18n="labelName"></label>
      <input id="pName" />
      <div class="row">
        <div>
          <label data-i18n="labelGender"></label>
          <select id="pGender">
            <option value="male" data-i18n="genderMale"></option>
            <option value="female" data-i18n="genderFemale"></option>
          </select>
        </div>
        <div>
          <label data-i18n="labelAge"></label>
          <input id="pAge" type="number" min="10" max="100" />
        </div>
      </div>
      <div class="row">
        <div>
          <label data-i18n="labelHeight"></label>
          <input id="pHeight" type="number" />
        </div>
        <div>
          <label data-i18n="labelWeight"></label>
          <input id="pWeight" type="number" />
        </div>
      </div>
      <label data-i18n="labelGoal"></label>
      <select id="pGoal">
        <option value="muscle" data-i18n="goalMuscle"></option>
        <option value="strength" data-i18n="goalStrength"></option>
        <option value="fatloss" data-i18n="goalFatloss"></option>
        <option value="recomp" data-i18n="goalRecomp"></option>
        <option value="health" data-i18n="goalHealth"></option>
      </select>
      <label data-i18n="labelWeeklyFreq"></label>
      <input id="pFreq" type="number" min="1" max="7" />
      <label data-i18n="labelExperience"></label>
      <select id="pExp">
        <option value="beginner" data-i18n="expBeginner"></option>
        <option value="intermediate" data-i18n="expIntermediate"></option>
        <option value="advanced" data-i18n="expAdvanced"></option>
      </select>
      <label data-i18n="labelActivity"></label>
      <select id="pActivity">
        <option value="low" data-i18n="activityLow"></option>
        <option value="medium" data-i18n="activityMedium"></option>
        <option value="high" data-i18n="activityHigh"></option>
      </select>
      <button class="btn-primary" style="margin-top:14px" id="saveProfileBtn" data-i18n="btnSave"></button>
    </div>
  </section>

  <!-- OVQAT -->
  <section class="screen" id="screen-more">
    <div class="card">
      <h2>🍽 <span data-i18n="nutriTitle"></span></h2>
      <p class="muted" data-i18n="nutriBasis"></p>
      <div class="nutri-grid" id="nutriGrid"></div>

      <div class="nutri-toggle" id="nutriAdjustToggle">⚙️ <span data-i18n="btnAdjust"></span></div>
      <div id="nutriAdjust" style="display:none">
        <label data-i18n="labelProteinPerKg"></label>
        <input id="macroProteinPerKg" type="number" step="0.1" value="1.8" />
        <label data-i18n="labelKcalOverride"></label>
        <input id="macroKcalOverride" type="number" data-i18n-ph="placeholderKcal" />
        <button class="btn-secondary" style="margin-top:10px" id="macroCalcBtn" data-i18n="btnRecalc"></button>
      </div>
    </div>

    <div class="card">
      <h2>👨‍🍳 <span data-i18n="recipeTitle"></span></h2>
      <p class="muted" data-i18n="recipeIntro"></p>
      <input id="recipeInput" data-i18n-ph="placeholderRecipe" />
      <button class="btn-primary" style="margin-top:10px" id="recipeBtn" data-i18n="btnGetRecipe"></button>
      <div id="recipeResult" class="md-content" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <h2>🎙 <span data-i18n="voiceTitle"></span></h2>
      <p class="muted" data-i18n="voiceDesc"></p>
      <button class="btn-secondary" disabled data-i18n="btnSoon"></button>
    </div>
    <div class="card">
      <h2>🩺 <span data-i18n="healthTitle"></span></h2>
      <p class="muted" data-i18n="healthDesc"></p>
      <input type="file" id="healthFile" accept="image/*,.pdf" />
      <div id="healthStatus" class="muted" style="margin-top:8px"></div>
    </div>
  </section>
</div>

<nav class="bottom">
  <div class="tab active" data-screen="today"><span class="ic">🏠</span><span data-i18n="navToday"></span></div>
  <div class="tab" data-screen="coach"><span class="ic">🧑‍🏫</span><span data-i18n="navCoach"></span></div>
  <div class="tab" data-screen="progress"><span class="ic">📈</span><span data-i18n="navProgress"></span></div>
  <div class="tab" data-screen="profile"><span class="ic">👤</span><span data-i18n="navProfile"></span></div>
  <div class="tab" data-screen="more"><span class="ic">🍽</span><span data-i18n="navNutrition"></span></div>
</nav>

<div class="overlay hidden" id="onboardingOverlay">
  <div class="sheet">
    <div class="step-dots"><span class="on" data-step="0"></span><span data-step="1"></span><span data-step="2"></span></div>

    <div id="ob-step-0">
      <h2 style="margin-top:0" data-i18n="obWelcome"></h2>
      <p class="muted" data-i18n="obIntro"></p>
      <label data-i18n="labelYourName"></label>
      <input id="obName" />
      <div class="row">
        <div>
          <label data-i18n="labelGender"></label>
          <select id="obGender">
            <option value="male" data-i18n="genderMale"></option>
            <option value="female" data-i18n="genderFemale"></option>
          </select>
        </div>
        <div>
          <label data-i18n="labelAge"></label>
          <input id="obAge" type="number" min="10" max="100" />
        </div>
      </div>
      <div class="row">
        <div>
          <label data-i18n="labelHeight"></label>
          <input id="obHeight" type="number" />
        </div>
        <div>
          <label data-i18n="labelWeight"></label>
          <input id="obWeight" type="number" />
        </div>
      </div>
      <button class="btn-primary" style="margin-top:16px" onclick="obNext(1)" data-i18n="btnNext"></button>
    </div>

    <div id="ob-step-1" style="display:none">
      <h2 style="margin-top:0" data-i18n="obGoalTitle"></h2>
      <select id="obGoal">
        <option value="muscle" data-i18n="goalMuscle"></option>
        <option value="strength" data-i18n="goalStrength"></option>
        <option value="fatloss" data-i18n="goalFatloss"></option>
        <option value="recomp" data-i18n="goalRecomp"></option>
        <option value="health" data-i18n="goalHealth"></option>
      </select>
      <label data-i18n="labelActivityLevel"></label>
      <select id="obActivity">
        <option value="low" data-i18n="activityLow"></option>
        <option value="medium" data-i18n="activityMedium"></option>
        <option value="high" data-i18n="activityHigh"></option>
      </select>
      <div class="row" style="margin-top:16px">
        <button class="btn-secondary" onclick="obNext(0)" data-i18n="btnBack"></button>
        <button class="btn-primary" onclick="obNext(2)" data-i18n="btnNext"></button>
      </div>
    </div>

    <div id="ob-step-2" style="display:none">
      <h2 style="margin-top:0" data-i18n="obTrainingTitle"></h2>
      <label data-i18n="labelYourExperience"></label>
      <select id="obExp">
        <option value="beginner" data-i18n="expBeginner"></option>
        <option value="intermediate" data-i18n="expIntermediate"></option>
        <option value="advanced" data-i18n="expAdvanced"></option>
      </select>
      <label data-i18n="labelWeeklyDays"></label>
      <input id="obFreq" type="number" min="1" max="7" value="3" />
      <div class="row" style="margin-top:16px">
        <button class="btn-secondary" onclick="obNext(1)" data-i18n="btnBack"></button>
        <button class="btn-primary" onclick="finishOnboarding()" data-i18n="btnStart"></button>
      </div>
    </div>
  </div>
</div>

<script>
const translations = {
  uz: {
    tagline: "Shaxsiy sun'iy intellekt murabbiyingiz",
    modeTelegram: "Telegram",
    modeWeb: "Veb rejimi",
    navToday: "Bugun",
    navCoach: "Murabbiy",
    navProgress: "Natija",
    navProfile: "Profil",
    navNutrition: "Ovqat",

    briefTitle: "Bugungi holat so'rovi",
    briefIntro: "Mashg'ulot berishdan oldin bugungi holatingizni bilishim kerak.",
    labelGoal: "Maqsad",
    goalMuscle: "Mushak olish",
    goalStrength: "Kuch oshirish",
    goalFatloss: "Ozish",
    goalRecomp: "Tana tarkibini o'zgartirish",
    goalHealth: "Sog'lom ovqatlanish",
    goalMixed: "Aralash",
    labelMuscleGroup: "Bugun qaysi mushak guruhi? (ixtiyoriy, bo'sh qoldirsangiz murabbiy tanlaydi)",
    placeholderMuscleGroup: "masalan: ko'krak, orqa, oyoq...",
    labelEnergy: "Energiya",
    labelSleep: "Bugungi uyqu (soat)",
    labelLastWorkout: "Oxirgi mashg'ulot (nima va qachon)",
    placeholderLastWorkout: "masalan: 2 kun oldin yelka",
    labelTime: "Bugun qancha vaqtingiz bor?",
    time45: "45 daqiqa",
    time60: "60 daqiqa",
    time90: "90 daqiqa",
    time120: "2 soat",
    labelPain: "Og'riq yoki noqulaylik bormi?",
    placeholderPain: "masalan: yo'q / tizza biroz og'riydi",
    btnGetWorkout: "Mashg'ulotni olish",
    btnPreparing: "Tayyorlanmoqda...",
    planTitle: "Bugungi reja",
    btnNewBrief: "Qayta so'rovdan o'tish",
    logTitle: "Mashqni qayd etish",
    placeholderExercise: "Mashq nomi",
    placeholderSets: "To'plam",
    placeholderReps: "Takror",
    placeholderWeight: "Vazn (kg)",
    btnAdd: "Qo'shish",

    coachTitle: "Murabbiy bilan suhbat",
    placeholderChat: "Savolingizni yozing...",
    btnSend: "Yuborish",

    progressTitle: "Vazn / bel kiritish",
    placeholderWeightKg: "Vazn (kg)",
    placeholderWaist: "Bel (sm)",
    btnSave: "Saqlash",
    historyTitle: "Tarix",
    emptyData: "Hali ma'lumot yo'q",
    kgSuffix: "kg",
    waistSuffix: "sm bel",

    profileTitle: "Profil",
    labelName: "Ism",

const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const isTelegram = !!(tg && tg.initData);
if (tg) { tg.ready(); tg.expand(); }

async function api(path, method, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (isTelegram) headers['X-Telegram-Init-Data'] = tg.initData;
  const res = await fetch(path, {
    method: method || 'GET',
    headers,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const errBody = await res.json().catch(() => ({}));
    throw new Error(errBody.error || t('genericError'));
  }
  return res.json();
}

function lsGet(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function lsSet(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

const Store = {
  async getProfile() {
    if (isTelegram) return (await api('/api/profile')).profile;
    return lsGet('forma_profile', null);
  },
  async setProfile(profile) {
    if (isTelegram) return (await api('/api/profile', 'POST', profile)).profile;
    lsSet('forma_profile', profile);
    return profile;
  },
  async getTodayPlan() {
    if (isTelegram) return (await api('/api/workout/today')).todayPlan;
    return lsGet('forma_today_plan', null);
  },
  async setTodayPlan(plan) {
    if (isTelegram) return (await api('/api/workout/today', 'POST', plan)).todayPlan;
    lsSet('forma_today_plan', plan);
    return plan;
  },
  async logWorkout(entry) {
    if (isTelegram) return api('/api/workout/log', 'POST', entry);
    const list = lsGet('forma_workout_log', []);
    list.push(entry);
    lsSet('forma_workout_log', list);
    return { ok: true, entry };
  },
  async getWorkoutLog() {
    if (isTelegram) {
      const p = await api('/api/progress');
      return (p.progress || []).filter((x) => x.type === 'workout' || x.exercise);
    }
    return lsGet('forma_workout_log', []);

  async getProgress() {
    if (isTelegram) return (await api('/api/progress')).progress;
    return lsGet('forma_progress', []);
  },
  async addProgress(entry) {
    if (isTelegram) return (await api('/api/progress', 'POST', entry)).entry;
    const list = lsGet('forma_progress', []);

  },

};

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function inlineFormat(str) {
  return str.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function exerciseLinksHtml(name) {
  const q = encodeURIComponent(name + ' ' + t('searchTechnique'));
  const ytUrl = 'https://www.youtube.com/results?search_query=' + q;
  const imgUrl = 'https://www.google.com/search?tbm=isch&q=' + q;
  return `<div class="exercise-links"><a href="${ytUrl}" target="_blank" rel="noopener">🎥 ${t('ytLink')}</a><a href="${imgUrl}" target="_blank" rel="noopener">🖼 ${t('imgLink')}</a></div>`;
}

function renderMarkdown(text) {
  const lines = escapeHtml(text || '').split('\n');
  let html = '';
  let inList = false;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };

  for (const raw of lines) {
    const line = raw.trim();
    if (!line) { closeList(); continue; }

    if (/^-{3,}$/.test(line)) { closeList(); html += '<hr/>'; continue; }

    const headerMatch = line.match(/^(#{1,6})\s+(.*)$/);
    if (headerMatch) {
      closeList();
      const level = headerMatch[1].length;
      const content = inlineFormat(headerMatch[2]);
      const tag = 'h' + Math.min(level, 6);
      html += `<${tag}>${content}</${tag}>`;
      const exerciseMatch = headerMatch[2].match(/^\d+\.\s*\*{0,2}(.+?)\*{0,2}$/);
      if (level >= 4 && exerciseMatch) {
        html += exerciseLinksHtml(exerciseMatch[1].trim());
      }
      continue;
    }

    const bulletMatch = line.match(/^[-*]\s+(.*)$/);
    if (bulletMatch) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inlineFormat(bulletMatch[1])}</li>`;
      continue;
    }

    closeList();
    html += `<p>${inlineFormat(line)}</p>`;
  }
  closeList();
  return html;
}

function renderWorkoutPlan(text) {
  const escaped = escapeHtml(text || '');
  const lines = escaped.split('\n');
  let intro = '';
  const cards = [];
  let current = null;

  for (const raw of lines) {
    const line = raw.trim();
    if (!line || /^-{3,}$/.test(line)) continue;

    const headerMatch = line.match(/^(#{1,6})\s+(.*)$/);
    if (headerMatch) {
      const level = headerMatch[1].length;
      const content = headerMatch[2];
      const exerciseMatch = content.match(/^\d+\.\s*\*{0,2}(.+?)\*{0,2}$/);
      if (level >= 4 && exerciseMatch) {
        current = { title: exerciseMatch[1].trim(), rows: [] };
        cards.push(current);
      } else if (!current) {
        intro += `<p>${inlineFormat(content)}</p>`;
      }
      continue;
    }

    const bulletMatch = line.match(/^[-*]\s+(.*)$/);
    const text2 = bulletMatch ? bulletMatch[1] : line;
    const labelMatch = text2.match(/^\*\*(.+?):\*\*\s*(.*)$/);

    if (current) {
      if (labelMatch) {
        current.rows.push({ label: labelMatch[1], value: labelMatch[2] });
      } else {
        current.rows.push({ label: '', value: text2 });
      }
    } else {
      intro += `<p>${inlineFormat(text2)}</p>`;
    }
  }

  if (!cards.length) return renderMarkdown(text);

  let html = intro ? `<div class="plan-intro">${intro}</div>` : '';
  cards.forEach((card, i) => {
    html += `<div class="exercise-card">`;
    html += `<div class="exercise-card-head"><span class="exercise-num">${i + 1}</span><span class="exercise-name">${inlineFormat(card.title)}</span></div>`;
    html += exerciseLinksHtml(card.title);
    html += `<div class="exercise-rows">`;
    card.rows.forEach((r) => {
      if (r.label) {
        html += `<div class="exercise-row"><span class="exercise-row-label">${inlineFormat(r.label)}</span><span class="exercise-row-value">${inlineFormat(r.value)}</span></div>`;
      } else if (r.value) {
        html += `<div class="exercise-row-note">${inlineFormat(r.value)}</div>`;
      }
    });
    html += `</div></div>`;
  });

  return html;
}

async function sendCoachMessage(text, { silent } = {}) {
  const chat = Store.getChat();
  if (!silent) {
    chat.push({ role: 'user', content: text });
    renderChat(chat);
  }
  const profile = await Store.getProfile();
  const body = {
    message: text,
    profile,
    history: chat.slice(-12),
    lang: currentLang,
  };
  const data = await api('/api/coach/chat', 'POST', body);
  chat.push({ role: 'assistant', content: data.reply });
  Store.setChat(chat);
  renderChat(chat);
  return data.reply;
}

function renderChat(chat) {
  const log = document.getElementById('chatLog');
  log.innerHTML = '';
  chat.forEach((m) => {
    const div = document.createElement('div');
    if (m.role === 'user') {
      div.className = 'msg user';
      div.textContent = m.content;
    } else {
      div.className = 'msg assistant md-content';
      div.innerHTML = renderMarkdown(m.content);
    }
    log.appendChild(div);
  });
  log.scrollTop = log.scrollHeight;
}

document.getElementById('addLogBtn').addEventListener('click', async () => {
  const entry = {
    exercise: document.getElementById('logExercise').value,
    sets: document.getElementById('logSets').value,
    reps: document.getElementById('logReps').value,
    weight: document.getElementById('logWeight').value,
    date: new Date().toISOString().slice(0, 10),
  };
  if (!entry.exercise) return;
  await Store.logWorkout(entry);
  workoutLogCache.push(entry);
  renderLogList();
  document.getElementById('logExercise').value = '';
  document.getElementById('logSets').value = '';
  document.getElementById('logReps').value = '';
  document.getElementById('logWeight').value = '';
});

function renderLogList() {
  const el = document.getElementById('logList');
  if (!el) return;
  if (!workoutLogCache.length) { el.innerHTML = ''; return; }
  el.innerHTML = workoutLogCache.slice(-8).reverse().map((e) =>
    `<div class="list-item"><span>${e.exercise}</span><span>${e.sets}×${e.reps} — ${e.weight || 0} ${t('kgSuffix')}</span></div>`
  ).join('');
}

document.getElementById('addProgressBtn').addEventListener('click', async () => {
  const weight = document.getElementById('progWeight').value;
  const waist = document.getElementById('progWaist').value;
  if (!weight && !waist) return;
  const entry = { type: 'measurement', weight: weight || null, waist: waist || null, date: new Date().toISOString().slice(0, 10) };
  await Store.addProgress(entry);
  document.getElementById('progWeight').value = '';
  document.getElementById('progWaist').value = '';
  loadProgress();
});

async function loadProgress() {
  const list = (await Store.getProgress()) || [];
  const el = document.getElementById('progressList');
  if (!el) return;
  if (!list.length) { el.innerHTML = `<div class="empty">${t('emptyData')}</div>`; return; }
  el.innerHTML = list.slice(-15).reverse().map((e) =>
    `<div class="list-item"><span>${e.date || ''}</span><span>${e.weight ? e.weight + ' ' + t('kgSuffix') : ''} ${e.waist ? '· ' + e.waist + ' ' + t('waistSuffix') : ''}</span></div>`
  ).join('');
}

document.getElementById('healthFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  document.getElementById('healthStatus').textContent = file
    ? t('healthFileAccepted').replace('{file}', `"${file.name}"`)
    : '';
});

const GOAL_PROTEIN_PER_KG = { muscle: 2.0, strength: 2.0, fatloss: 2.2, recomp: 2.2, health: 1.6 };
const ACTIVITY_MULTIPLIER = { low: 1.2, medium: 1.55, high: 1.75 };
const GOAL_KCAL_ADJUST = { fatloss: -500, muscle: 300, strength: 200, recomp: -200, health: 0 };

function computeNutritionTargets(profile, overrides) {
  const p = profile || {};
  const weight = Number(p.weight) || 70;
  const height = Number(p.height) || 170;
  const age = Number(p.age) || 28;
  const gender = p.gender || 'male';
  const activity = p.activity || 'medium';
  const goal = p.goal || 'muscle';

  const bmr = gender === 'female'
    ? 10 * weight + 6.25 * height - 5 * age - 161
    : 10 * weight + 6.25 * height - 5 * age + 5;

  const tdee = bmr * (ACTIVITY_MULTIPLIER[activity] || 1.4);
  const goalAdjust = GOAL_KCAL_ADJUST[goal] ?? 0;

  const proteinPerKg = (overrides && overrides.proteinPerKg) || GOAL_PROTEIN_PER_KG[goal] || 1.8;
  const kcal = Math.round((overrides && overrides.kcal) || (tdee + goalAdjust));
  const proteinG = Math.round(weight * proteinPerKg);
  const proteinKcal = proteinG * 4;
  const fatKcal = Math.round(kcal * 0.25);
  const fatG = Math.round(fatKcal / 9);
  const carbKcal = Math.max(kcal - proteinKcal - fatKcal, 0);
  const carbG = Math.round(carbKcal / 4);

  return { kcal, proteinG, fatG, carbG, proteinPerKg };
}

async function refreshNutrition(overrides) {
  const profile = await Store.getProfile();
  const tgt = computeNutritionTargets(profile, overrides);
  const grid = document.getElementById('nutriGrid');
  if (grid) {
    grid.innerHTML = `
      <div class="nutri-item"><div class="val">${tgt.kcal}</div><div class="lbl">${t('nutriKcal')}</div></div>
      <div class="nutri-item"><div class="val">${tgt.proteinG} ${t('kgSuffix') === 'kg' ? 'g' : 'г'}</div><div class="lbl">${t('nutriProtein')}</div></div>
      <div class="nutri-item"><div class="val">${tgt.carbG} ${t('kgSuffix') === 'kg' ? 'g' : 'г'}</div><div class="lbl">${t('nutriCarb')}</div></div>
      <div class="nutri-item"><div class="val">${tgt.fatG} ${t('kgSuffix') === 'kg' ? 'g' : 'г'}</div><div class="lbl">${t('nutriFat')}</div></div>
    `;
  }
  const ppk = document.getElementById('macroProteinPerKg');
  if (ppk) ppk.value = tgt.proteinPerKg;
  return tgt;
}

document.getElementById('nutriAdjustToggle').addEventListener('click', () => {
  const el = document.getElementById('nutriAdjust');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
});

document.getElementById('macroCalcBtn').addEventListener('click', () => {
  const proteinPerKg = Number(document.getElementById('macroProteinPerKg').value) || 1.8;
  const kcalOverride = Number(document.getElementById('macroKcalOverride').value) || null;
  refreshNutrition({ proteinPerKg, kcal: kcalOverride });
});

document.getElementById('recipeBtn').addEventListener('click', async () => {
  const input = document.getElementById('recipeInput').value.trim();
  const resultEl = document.getElementById('recipeResult');
  const btn = document.getElementById('recipeBtn');
  const profile = await Store.getProfile();
  const message = currentLang === 'ru'
    ? (input
      ? `У меня есть следующие продукты/предпочтения: ${input}. Предложи 1 рецепт, который можно приготовить дома — укажи продукты в граммах, посчитай общую и порционную калорийность, белки, углеводы и жиры. Только на русском языке, без иностранных слов.`
      : "Предложи 1 рецепт, который можно приготовить дома, подходящий под мою сегодняшнюю цель по питанию — укажи продукты в граммах, посчитай общую и порционную калорийность, белки, углеводы и жиры. Только на русском языке, без иностранных слов.")
    : (input
      ? `Menda quyidagi mahsulotlar/afzalliklar bor: ${input}. Shularga mos, uyda tayyorlash mumkin bo'lgan 1 ta retsept tavsiya qiling — mahsulotlarni grammda yozing, jami va 1 porsiya kaloriya/oqsil/uglevod/yog'ni hisoblang. Faqat o'zbek tilida, chet so'zlarsiz yozing.`
      : "Bugungi ovqatlanish maqsadimga mos, uyda tayyorlash mumkin bo'lgan 1 ta retsept tavsiya qiling — mahsulotlarni grammda yozing, jami va 1 porsiya kaloriya/oqsil/uglevod/yog'ni hisoblang. Faqat o'zbek tilida, chet so'zlarsiz yozing.");
  btn.disabled = true;
  btn.textContent = t('btnPreparing');
  try {
    const data = await api('/api/coach/chat', 'POST', { message, profile, history: [], lang: currentLang });
    resultEl.innerHTML = renderMarkdown(data.reply);
  } catch (err) {
    resultEl.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = t('btnGetRecipe');
  }
});

async function init() {
  applyLanguage(currentLang);

  const profile = await Store.getProfile();
  if (!profile) {
    document.getElementById('onboardingOverlay').classList.remove('hidden');
  } else {
    fillProfileForm(profile);
  }

  const plan = await Store.getTodayPlan();
  if (plan && plan.text) {
    document.getElementById('planText').innerHTML = renderWorkoutPlan(plan.text);
    document.getElementById('planCard').style.display = 'block';
    document.getElementById('briefCard').style.display = 'none';
  }

  workoutLogCache = (await Store.getWorkoutLog()) || [];
  renderLogList();

  renderChat(Store.getChat());
  loadProgress();
  refreshNutrition();
}

init();
</script>
